name: Isolated contribution validation
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  baseline:
    name: candidate / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 331942722dec38b505c4a32f6ca73493907348e1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full test suite
        run: npm test
      - name: Regression test file ordering
        run: |
          node -e "const Mocha=require('mocha');const runner=new Mocha();runner.addFile('test/combine.test.js');runner.addFile('test/colorize.test.js');runner.run(failures=>{process.exitCode=failures?1:0})"
          node -e "const Mocha=require('mocha');const runner=new Mocha();runner.addFile('test/colorize.test.js');runner.addFile('test/combine.test.js');runner.run(failures=>{process.exitCode=failures?1:0})"
      - name: Upstream TypeScript gate
        if: always()
        run: npx --yes --package typescript tsc
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
