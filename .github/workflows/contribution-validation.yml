name: Isolated contribution validation
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  baseline:
    name: baseline / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7a35d257c0157793ccd0dda23c4f89788be8f05a
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full test suite
        run: npm test
      - name: Upstream TypeScript gate
        if: always()
        run: npx --yes --package typescript tsc
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
